# XcodeGen spec — generates Swell.xcodeproj deterministically.
#
#   brew install xcodegen   # once
#   xcodegen generate       # produces the .xcodeproj
#   open Swell.xcodeproj
#
# Regenerating from this file means the project is reviewable as plain text and
# never carries a hand-merged pbxproj conflict.

name: Swell
options:
  bundleIdPrefix: fm.swell
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    # Matches the App Store Connect "RADIOSPLUS" record (Apple ID 6794523437),
    # version 1.0 in Prepare for Submission.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "4XMMKU4W89" # Onesync Media LLC

# The scheme the README's build/test commands use: builds the app, tests the
# RadioKit unit suite.
schemes:
  Swell:
    build:
      targets:
        Swell: all
        RadioKitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RadioKitTests

targets:
  RadioKit:
    type: framework
    platform: iOS
    sources:
      - Sources/RadioKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: RADIOPLUSAPP.kit
        GENERATE_INFOPLIST_FILE: YES

  Swell:
    type: application
    platform: iOS
    sources:
      - Sources/SwellApp
      # Folder reference: drop licensed masters in RealAudio/ and the app
      # plays them (contents are gitignored; see RealAudio/README.md).
      - path: RealAudio
        type: folder
        buildPhase: resources
      # OFL display faces (licenses alongside in OFL-*.txt).
      - path: Resources/Fonts
        buildPhase: resources
    dependencies:
      - target: RadioKit
    settings:
      base:
        # ASC record "SWELL RADIO" (Apple ID 6794523437) — originally created
        # as RADIOSPLUS, renamed 2026-07-24. Builds attach via this bundle id.
        # (com.onesync.radioplus is also registered in the portal but unused.)
        PRODUCT_BUNDLE_IDENTIFIER: RADIOPLUSAPP
        # iPhone-only: the plate is a portrait phone instrument, and ASC
        # rejects portrait-only bundles that also target iPad (error 90474).
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Sources/SwellApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/SwellApp/Swell.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  RadioKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/RadioKitTests
    dependencies:
      - target: RadioKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fm.swell.kit.tests
        GENERATE_INFOPLIST_FILE: YES
