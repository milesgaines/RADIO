# XcodeGen spec — generates Swell.xcodeproj deterministically.
#
#   brew install xcodegen   # once
#   xcodegen generate       # produces the .xcodeproj
#   open Swell.xcodeproj
#
# Regenerating from this file means the project is reviewable as plain text and
# never carries a hand-merged pbxproj conflict.

name: Swell
options:
  bundleIdPrefix: fm.swell
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "" # set your team, or configure signing in Xcode

# The scheme the README's build/test commands use: builds the app, tests the
# RadioKit unit suite.
schemes:
  Swell:
    build:
      targets:
        Swell: all
        RadioKitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RadioKitTests

targets:
  RadioKit:
    type: framework
    platform: iOS
    sources:
      - Sources/RadioKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fm.swell.kit
        GENERATE_INFOPLIST_FILE: YES

  Swell:
    type: application
    platform: iOS
    sources:
      - Sources/SwellApp
      # Folder reference: drop licensed masters in RealAudio/ and the app
      # plays them (contents are gitignored; see RealAudio/README.md).
      - path: RealAudio
        type: folder
        buildPhase: resources
    dependencies:
      - target: RadioKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fm.swell.app
        INFOPLIST_FILE: Sources/SwellApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/SwellApp/Swell.entitlements
        GENERATE_INFOPLIST_FILE: NO

  RadioKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/RadioKitTests
    dependencies:
      - target: RadioKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fm.swell.kit.tests
        GENERATE_INFOPLIST_FILE: YES
