# XcodeGen spec — generates RadioPlus.xcodeproj deterministically.
#
#   brew install xcodegen   # once
#   xcodegen generate       # produces the .xcodeproj
#   open RadioPlus.xcodeproj
#
# Regenerating from this file means the project is reviewable as plain text and
# never carries a hand-merged pbxproj conflict.

name: RadioPlus
options:
  bundleIdPrefix: com.radioplus
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "" # set your team, or configure signing in Xcode

targets:
  RadioKit:
    type: framework
    platform: iOS
    sources:
      - Sources/RadioKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.radioplus.kit

  RadioPlus:
    type: application
    platform: iOS
    sources:
      - Sources/RadioPlusApp
    dependencies:
      - target: RadioKit
    # Shared scheme so CI's xcodebuild can find it on a fresh checkout.
    scheme:
      testTargets:
        - RadioKitTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.radioplus.app
        INFOPLIST_FILE: Sources/RadioPlusApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/RadioPlusApp/RadioPlus.entitlements
        GENERATE_INFOPLIST_FILE: NO

  RadioKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/RadioKitTests
    dependencies:
      - target: RadioKit
