<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RADI0 — THE BOARD</title>
<meta name="description" content="THE BOARD. RADI0 programming numbers, public and read-only.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=Archivo+Black&family=Gasoek+One&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:   #0a0a0c;
    --bone:  #f1ecdf;
    --ember: #ff5c2e;
    --hair:  rgba(241, 236, 223, 0.22);
    --dim:   rgba(241, 236, 223, 0.45);
    --ok:    #5ceb87;
    --bad:   #ff5c5c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--ink);
    color: var(--bone);
    font-family: 'Archivo Black', system-ui, sans-serif;
    min-height: 100svh;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.25rem 1.5rem;
  }
  .wordmark {
    display: flex; align-items: center;
    font-size: 1.3rem; letter-spacing: 0.08em; line-height: 1;
    user-select: none;
  }
  .wordmark svg { width: 1em; height: 1em; display: block; margin-left: 0.1em; }
  .stamp { font-size: 0.55rem; letter-spacing: 0.3em; color: var(--dim); white-space: nowrap; }

  .masthead {
    max-width: 68rem; margin: 0 auto;
    padding: 1rem 1.5rem 0;
  }
  .masthead h1 {
    font-family: 'Gasoek One', sans-serif;
    font-size: clamp(3rem, 13vw, 6.5rem);
    line-height: 0.95; letter-spacing: 0.02em;
    text-shadow: 0 0 70px rgba(255, 92, 46, 0.22);
  }
  .masthead .sub {
    margin-top: 0.7rem;
    font-size: 0.6rem; letter-spacing: 0.34em;
    color: var(--dim);
  }

  main {
    max-width: 68rem; margin: 0 auto;
    padding: 2rem 1.5rem 3rem;
    display: flex; flex-direction: column; gap: 1.5rem;
  }

  .panel { border: 1px solid var(--hair); padding: 1.1rem 1.2rem 1.3rem; }
  .panel[hidden] { display: none; }
  .panel-label {
    display: flex; align-items: baseline; justify-content: space-between; gap: 1rem;
    font-size: 0.6rem; letter-spacing: 0.35em;
    color: var(--ember);
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--hair);
    margin-bottom: 1rem;
  }
  .panel-note { font-size: 0.5rem; letter-spacing: 0.22em; color: rgba(241, 236, 223, 0.3); }

  .empty {
    font-family: 'Archivo', system-ui, sans-serif; font-weight: 500;
    font-size: 0.78rem; letter-spacing: 0.08em;
    color: var(--dim);
    padding: 0.4rem 0 0.2rem;
  }

  /* ---- STATION HEALTH cards ---- */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 0.75rem;
  }
  .card { border: 1px solid var(--hair); padding: 1rem 1rem 1.1rem; min-width: 0; }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.6rem; }
  .card-dial {
    font-family: 'Gasoek One', sans-serif;
    font-size: 2.1rem; line-height: 0.95;
    color: var(--acc, var(--ember));
  }
  .lamp {
    display: inline-flex; align-items: center; gap: 0.4rem;
    font-size: 0.52rem; letter-spacing: 0.22em;
    white-space: nowrap; margin-top: 0.3rem;
  }
  .lamp i { width: 0.45rem; height: 0.45rem; border-radius: 50%; flex: none; }
  .lamp.ok  { color: var(--ok); }  .lamp.ok i  { background: var(--ok); }
  .lamp.bad { color: var(--bad); } .lamp.bad i { background: var(--bad); }
  .live-badge {
    display: inline-flex; align-items: center; gap: 0.45rem;
    border: 1px solid rgba(255, 92, 46, 0.55);
    color: var(--ember);
    font-size: 0.52rem; letter-spacing: 0.22em;
    padding: 0.35rem 0.55rem; margin-top: 0.15rem;
    white-space: nowrap; max-width: 12rem;
    overflow: hidden; text-overflow: ellipsis;
  }
  .live-badge i {
    width: 0.45rem; height: 0.45rem; border-radius: 50%;
    background: var(--ember); flex: none;
    animation: blink 2.4s ease-in-out infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  .card-name { margin-top: 0.55rem; font-size: 0.54rem; letter-spacing: 0.28em; color: var(--dim); }
  .card-record {
    margin-top: 0.7rem;
    font-family: 'Archivo', system-ui, sans-serif; font-weight: 700;
    font-size: 0.8rem; letter-spacing: 0.05em; line-height: 1.4;
    overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .card-record.none { color: var(--dim); }
  .card-meta { margin-top: 0.6rem; font-size: 0.5rem; letter-spacing: 0.22em; color: rgba(241, 236, 223, 0.3); }

  /* ---- tables ---- */
  .tscroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th {
    font-size: 0.52rem; letter-spacing: 0.25em; font-weight: normal;
    color: var(--dim); text-align: left;
    padding: 0.45rem 0.7rem 0.55rem 0;
    white-space: nowrap;
  }
  td {
    font-family: 'Archivo', system-ui, sans-serif; font-weight: 500;
    font-size: 0.74rem; letter-spacing: 0.05em;
    padding: 0.55rem 0.7rem 0.55rem 0;
    border-top: 1px solid rgba(241, 236, 223, 0.12);
    white-space: nowrap; vertical-align: middle;
  }
  td.rec { max-width: 22rem; overflow: hidden; text-overflow: ellipsis; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td .dial-chip {
    font-family: 'Archivo Black', system-ui, sans-serif;
    font-size: 0.62rem; letter-spacing: 0.12em;
    color: var(--acc, var(--dim));
  }
  td .faint { color: var(--dim); }

  /* resonance bar: zero axis center, ember right, bone left */
  .rcell { display: flex; align-items: center; gap: 0.7rem; }
  .rbar {
    position: relative; width: 130px; height: 8px; flex: none;
    background: rgba(241, 236, 223, 0.08);
  }
  .rbar::after {
    content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px;
    width: 1px; background: var(--hair);
  }
  .rbar i { position: absolute; top: 0; bottom: 0; }
  .rbar i.pos { left: 50%; background: var(--ember); }
  .rbar i.neg { right: 50%; background: rgba(241, 236, 223, 0.65); }
  .rval { font-size: 0.66rem; font-variant-numeric: tabular-nums; min-width: 3.2rem; }
  .rval.neg { color: var(--dim); }

  /* ---- archive ---- */
  .chip {
    display: inline-block;
    border: 1px solid var(--hair);
    font-family: 'Archivo Black', system-ui, sans-serif;
    font-size: 0.48rem; letter-spacing: 0.22em;
    padding: 0.25rem 0.45rem;
    color: var(--dim);
  }
  .playlink {
    font-family: 'Archivo Black', system-ui, sans-serif;
    font-size: 0.56rem; letter-spacing: 0.28em;
    color: var(--ember);
    border-bottom: 1px solid rgba(255, 92, 46, 0.4);
    padding-bottom: 0.15rem;
  }
  .playlink:hover { border-bottom-color: var(--ember); }

  footer {
    display: flex; justify-content: center; gap: 0.9rem; align-items: center;
    padding: 1rem 1.5rem 2.5rem;
  }
  footer a {
    font-size: 0.6rem; letter-spacing: 0.3em; color: var(--dim);
    border-bottom: 1px solid transparent; padding-bottom: 0.2rem;
    transition: color 0.2s, border-color 0.2s;
  }
  footer a:hover { color: var(--bone); border-bottom-color: var(--hair); }

  @media (max-width: 520px) {
    .masthead, main { padding-left: 1rem; padding-right: 1rem; }
    .rbar { width: 90px; }
    td.rec { max-width: 13rem; }
  }
</style>
</head>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// Publishable key — public by design. RLS is the boundary: anonymous clients
// can only read the broadcast tables. This board is read-only glass.
const SUPABASE_URL = 'https://tgkgdquivdoquxamtgcr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_JYYXKdhcGnEP5curdG_pLg_XVcy9-ii';

const STATIONS = [
  { id: 'bb940e5c-0a54-852c-b00c-81434978757c', dial: 'PWR',  name: 'PWR DAMIZZA',     acc: '#ff5c2e' },
  { id: 'df29c50a-76a7-8f76-bb6d-7e3434d2036e', dial: '78',   name: 'THE VAULT',       acc: '#4db8ff' },
  { id: 'ba13d3b9-a9c7-807d-b73b-065938f474b5', dial: '1200', name: 'THE UNDERGROUND', acc: '#5ceb87' },
  { id: null,                                    dial: '247',  name: 'THE WAVE',        acc: '#db70ff' },
];
const WAVE = STATIONS[3];

const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = (id) => document.getElementById(id);

// Postgres timestamptz arrives in several shapes ('...+00', '...+00:00',
// microsecond fractions, space separators). Normalize for Date.parse.
function parseTs(s) {
  if (!s) return NaN;
  let t = String(s).trim().replace(' ', 'T');
  t = t.replace(/(\.\d{3})\d+/, '$1');
  t = t.replace(/([+-]\d{2})$/, '$1:00');
  if (!/(Z|[+-]\d{2}:?\d{2})$/i.test(t)) t += 'Z';
  return Date.parse(t);
}

function stationFor(id) { return STATIONS.find((s) => s.id === id) || null; }

function ago(ts) {
  const ms = Date.now() - ts;
  if (!Number.isFinite(ms) || ms < 0) return '—';
  const s = Math.floor(ms / 1000);
  if (s < 60) return s + 'S AGO';
  const m = Math.floor(s / 60);
  if (m < 60) return m + 'M AGO';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'H AGO';
  return Math.floor(h / 24) + 'D AGO';
}

function fmtDur(sec) {
  const n = Math.round(Number(sec) || 0);
  if (!n) return '—';
  const h = Math.floor(n / 3600), m = Math.floor((n % 3600) / 60), s = n % 60;
  const mm = String(m).padStart(h ? 2 : 1, '0'), ss = String(s).padStart(2, '0');
  return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}

const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function fmtDate(ts) {
  if (!Number.isFinite(ts)) return '—';
  const d = new Date(ts);
  const base = `${MONTHS[d.getMonth()]} ${String(d.getDate()).padStart(2, '0')}`;
  return d.getFullYear() === new Date().getFullYear() ? base : `${base} ${d.getFullYear()}`;
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

// ---- data pulls (each panel fails alone; a dead query hides its panel) ----

async function pull(table, build) {
  try {
    const { data, error } = await build(sb.from(table));
    if (error) return null;
    return data || [];
  } catch (_) { return null; }
}

async function refreshAll() {
  const [np, live, reso, spins, episodes] = await Promise.all([
    pull('radio_now_playing', (q) => q.select('*')),
    pull('radio_live',        (q) => q.select('*')),
    pull('radio_resonance',   (q) => q.select('*').order('computed_at', { ascending: false }).limit(60)),
    pull('radio_play_history',(q) => q.select('*').order('played_at', { ascending: false }).limit(60)),
    pull('radio_episodes',    (q) => q.select('*').order('recorded_at', { ascending: false }).limit(30)),
  ]);

  // Discover THE WAVE: any on-air id we don't know claims the 247 slot.
  if (np) for (const row of np) {
    if (!stationFor(row.station_id) && !WAVE.id) WAVE.id = row.station_id;
  }

  // Resolve track_id -> title/artist for THE READ and RECENT SPINS.
  const ids = new Set();
  if (reso)  for (const r of reso)  if (r.track_id) ids.add(r.track_id);
  if (spins) for (const r of spins) if (r.track_id) ids.add(r.track_id);
  let tracks = null;
  if (ids.size) {
    tracks = await pull('radio_tracks', (q) =>
      q.select('track_id,title,artist').in('track_id', [...ids]));
  }
  const trackMap = new Map();
  if (tracks) for (const t of tracks) trackMap.set(t.track_id, t);
  // Fallback: whatever the now-playing rows know.
  if (np) for (const r of np) {
    if (r.track_id && !trackMap.has(r.track_id)) trackMap.set(r.track_id, r);
  }

  renderHealth(np, live);
  renderRead(reso, trackMap);
  renderSpins(spins, trackMap);
  renderArchive(episodes);

  $('stamp').textContent = 'LAST CHECK ' +
    new Date().toLocaleTimeString('en-GB', { hour12: false });
}

// ---- STATION HEALTH -------------------------------------------------------

function renderHealth(np, live) {
  const panel = $('panel-health');
  if (!np) { panel.hidden = true; return; }
  panel.hidden = false;

  const npMap = new Map(np.map((r) => [r.station_id, r]));
  const liveMap = new Map((live || []).filter((r) => r.live).map((r) => [r.station_id, r]));

  const cards = $('cards');
  cards.textContent = '';
  for (const st of STATIONS) {
    const card = el('div', 'card');
    card.style.setProperty('--acc', st.acc);

    const top = el('div', 'card-top');
    top.appendChild(el('div', 'card-dial', st.dial));

    const row = st.id ? npMap.get(st.id) : null;
    const liveRow = st.id ? liveMap.get(st.id) : null;

    if (liveRow) {
      const badge = el('span', 'live-badge');
      badge.appendChild(el('i'));
      badge.appendChild(document.createTextNode(
        'LIVE' + (liveRow.title ? ' — ' + String(liveRow.title).toUpperCase() : '')));
      top.appendChild(badge);
    } else {
      const updated = row ? parseTs(row.updated_at) : NaN;
      const fresh = Number.isFinite(updated) && (Date.now() - updated) <= 3 * 60 * 1000;
      const lamp = el('span', 'lamp ' + (fresh ? 'ok' : 'bad'));
      lamp.appendChild(el('i'));
      lamp.appendChild(document.createTextNode(fresh ? 'ON CLOCK' : 'STALLED'));
      top.appendChild(lamp);
    }
    card.appendChild(top);

    card.appendChild(el('div', 'card-name', st.name));

    if (row && row.title) {
      card.appendChild(el('div', 'card-record',
        `${String(row.title).toUpperCase()} — ${String(row.artist || 'UNKNOWN').toUpperCase()}`));
      const updated = parseTs(row.updated_at);
      card.appendChild(el('div', 'card-meta',
        'LAST ADVANCE ' + (Number.isFinite(updated) ? ago(updated) : '—')));
    } else {
      const none = el('div', 'card-record none', 'NO SIGNAL');
      card.appendChild(none);
    }
    cards.appendChild(card);
  }
}

// ---- THE READ -------------------------------------------------------------

function recordName(trackId, trackMap) {
  const t = trackId ? trackMap.get(trackId) : null;
  if (t && t.title) {
    return `${String(t.title).toUpperCase()} — ${String(t.artist || 'UNKNOWN').toUpperCase()}`;
  }
  return null;
}

function renderRead(reso, trackMap) {
  const panel = $('panel-read');
  if (!reso) { panel.hidden = true; return; }
  panel.hidden = false;

  const body = $('read-body');
  body.textContent = '';

  const rows = reso
    .filter((r) => stationFor(r.station_id))
    .sort((a, b) => (b.resonance || 0) - (a.resonance || 0));

  if (!rows.length) {
    body.appendChild(el('div', 'empty',
      "NO SIGNAL IN THE WINDOW — the room hasn't voted this hour."));
    return;
  }

  const wrap = el('div', 'tscroll');
  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const hr = document.createElement('tr');
  for (const [label, cls] of [['STATION'], ['RECORD'], ['RESONANCE'],
                              ['BOOSTS', 'num'], ['BURIES', 'num'], ['LISTENERS', 'num']]) {
    const th = el('th', cls, label);
    hr.appendChild(th);
  }
  thead.appendChild(hr);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  for (const r of rows) {
    const st = stationFor(r.station_id);
    const tr = document.createElement('tr');

    const tdSt = document.createElement('td');
    const chip = el('span', 'dial-chip', st.dial);
    chip.style.setProperty('--acc', st.acc);
    tdSt.appendChild(chip);
    tr.appendChild(tdSt);

    const name = recordName(r.track_id, trackMap);
    const tdRec = el('td', 'rec');
    if (name) tdRec.textContent = name;
    else tdRec.appendChild(el('span', 'faint', 'ID ' + String(r.track_id || '').slice(0, 8).toUpperCase()));
    tr.appendChild(tdRec);

    const v = Math.max(-1, Math.min(1, Number(r.resonance) || 0));
    const tdR = document.createElement('td');
    const cell = el('div', 'rcell');
    const bar = el('div', 'rbar');
    const fill = el('i', v >= 0 ? 'pos' : 'neg');
    fill.style.width = (Math.abs(v) * 50).toFixed(1) + '%';
    bar.appendChild(fill);
    cell.appendChild(bar);
    const val = el('span', 'rval' + (v < 0 ? ' neg' : ''),
      (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(2));
    cell.appendChild(val);
    tdR.appendChild(cell);
    tr.appendChild(tdR);

    tr.appendChild(el('td', 'num', String(r.boosts ?? 0)));
    tr.appendChild(el('td', 'num', String(r.buries ?? 0)));
    tr.appendChild(el('td', 'num', String(r.listeners ?? 0)));
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  wrap.appendChild(table);
  body.appendChild(wrap);
}

// ---- RECENT SPINS ---------------------------------------------------------

function renderSpins(spins, trackMap) {
  const panel = $('panel-spins');
  if (!spins) { panel.hidden = true; return; } // table not readable — no panel
  const rows = spins.filter((r) => stationFor(r.station_id)).slice(0, 20);
  panel.hidden = false;

  const body = $('spins-body');
  body.textContent = '';

  if (!rows.length) {
    body.appendChild(el('div', 'empty', 'NO SPINS ON RECORD YET.'));
    return;
  }

  const wrap = el('div', 'tscroll');
  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const hr = document.createElement('tr');
  for (const label of ['TIME', 'STATION', 'RECORD']) hr.appendChild(el('th', null, label));
  thead.appendChild(hr);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  for (const r of rows) {
    const st = stationFor(r.station_id);
    const tr = document.createElement('tr');
    const ts = parseTs(r.played_at);
    const tdT = document.createElement('td');
    tdT.appendChild(el('span', 'faint', Number.isFinite(ts) ? ago(ts) : '—'));
    tr.appendChild(tdT);

    const tdSt = document.createElement('td');
    const chip = el('span', 'dial-chip', st.dial);
    chip.style.setProperty('--acc', st.acc);
    tdSt.appendChild(chip);
    tr.appendChild(tdSt);

    const name = recordName(r.track_id, trackMap);
    const tdRec = el('td', 'rec');
    if (name) tdRec.textContent = name;
    else tdRec.appendChild(el('span', 'faint', 'ID ' + String(r.track_id || '').slice(0, 8).toUpperCase()));
    tr.appendChild(tdRec);

    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  wrap.appendChild(table);
  body.appendChild(wrap);
}

// ---- THE ARCHIVE ----------------------------------------------------------

function renderArchive(episodes) {
  const panel = $('panel-archive');
  if (!episodes) { panel.hidden = true; return; }
  panel.hidden = false;

  const body = $('archive-body');
  body.textContent = '';

  if (!episodes.length) {
    body.appendChild(el('div', 'empty', 'NO EPISODES ON FILE.'));
    return;
  }

  const wrap = el('div', 'tscroll');
  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const hr = document.createElement('tr');
  for (const label of ['SHOW', 'SOURCE', 'DATE', 'LENGTH', '']) hr.appendChild(el('th', null, label));
  thead.appendChild(hr);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  for (const ep of episodes) {
    const tr = document.createElement('tr');

    const tdTitle = el('td', 'rec');
    tdTitle.textContent = String(ep.title || 'UNTITLED').toUpperCase();
    if (ep.host) {
      tdTitle.appendChild(document.createTextNode(' '));
      tdTitle.appendChild(el('span', 'faint', '· ' + String(ep.host).toUpperCase()));
    }
    tr.appendChild(tdTitle);

    const tdSrc = document.createElement('td');
    tdSrc.appendChild(el('span', 'chip', String(ep.source || '—').toUpperCase()));
    tr.appendChild(tdSrc);

    const tdDate = document.createElement('td');
    tdDate.appendChild(el('span', 'faint', fmtDate(parseTs(ep.recorded_at))));
    tr.appendChild(tdDate);

    tr.appendChild(el('td', 'num', fmtDur(ep.duration_seconds)));

    const tdPlay = document.createElement('td');
    if (ep.hls_url) {
      const a = el('a', 'playlink', 'PLAY');
      a.href = ep.hls_url;
      a.target = '_blank';
      a.rel = 'noopener';
      tdPlay.appendChild(a);
    }
    tr.appendChild(tdPlay);

    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  wrap.appendChild(table);
  body.appendChild(wrap);
}

// ---- wiring ---------------------------------------------------------------

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) refreshAll();
});

refreshAll();
setInterval(refreshAll, 20000);
</script>

</body>
</html>
